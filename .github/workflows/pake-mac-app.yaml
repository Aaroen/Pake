name: Build macOS App With Pake

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string
        default: "https://www.douyin.com"

      name:
        description: "Application name"
        required: true
        type: string
        default: "Douyin"

      icon:
        description: "Icon URL or local path; leave empty to auto-fetch"
        required: false
        type: string
        default: ""

      width:
        description: "Window width in pixels"
        required: false
        type: string
        default: "1200"

      height:
        description: "Window height in pixels"
        required: false
        type: string
        default: "780"

      app_version:
        description: "Application version"
        required: false
        type: string
        default: "1.0.0"

      top_bar_height:
        description: "macOS traffic-light safe area in pixels"
        required: false
        type: string
        default: "52"

      multi_arch:
        description: "Build universal Intel + Apple Silicon binary"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Restore Rust cache
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Create macOS traffic-light safe-area patch
        shell: bash
        env:
          TOP_BAR_HEIGHT: ${{ inputs.top_bar_height }}
        run: |
          set -euo pipefail

          case "$TOP_BAR_HEIGHT" in
            ''|*[!0-9]*)
              echo "top_bar_height must contain only digits"
              exit 1
              ;;
          esac

          cat > "$RUNNER_TEMP/pake-macos-safe-area.css" <<EOF
          :root {
            --pake-macos-safe-top: ${TOP_BAR_HEIGHT}px;
          }

          html,
          body {
            margin: 0 !important;
            box-sizing: border-box !important;
          }

          *, *::before, *::after {
            box-sizing: border-box !important;
          }

          #pake-top-dom {
            position: fixed !important;
            inset: 0 0 auto 0 !important;
            width: 100% !important;
            height: var(--pake-macos-safe-top) !important;
            min-height: var(--pake-macos-safe-top) !important;
            z-index: 2147483647 !important;
            background: transparent !important;
          }

          body > header,
          body > nav,
          body > [role="banner"],
          #root > header,
          #app > header,
          #__next > header {
            top: var(--pake-macos-safe-top) !important;
          }
          EOF

          cat > "$RUNNER_TEMP/pake-douyin-safe-area.js" <<EOF
          (() => {
            "use strict";

            const SAFE_TOP = ${TOP_BAR_HEIGHT};
            const MARKER = "data-pake-macos-safe-area";
            let appliedRoot = null;
            let scheduled = false;

            const isExcluded = (element) =>
              !(element instanceof HTMLElement) ||
              element.id === "pake-top-dom" ||
              element.closest?.("#pake-top-dom");

            const isFullPageRoot = (element) => {
              if (isExcluded(element)) return false;
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return (
                rect.top <= 2 &&
                rect.width >= window.innerWidth * 0.75 &&
                rect.height >= window.innerHeight * 0.65 &&
                style.display !== "none" &&
                style.visibility !== "hidden"
              );
            };

            const findRoot = () => {
              for (const selector of ["#root", "#app", "#__next", "[data-reactroot]"]) {
                const element = document.querySelector(selector);
                if (isFullPageRoot(element)) return element;
              }

              return [...(document.body?.children || [])]
                .filter(isFullPageRoot)
                .sort((a, b) => {
                  const ar = a.getBoundingClientRect();
                  const br = b.getBoundingClientRect();
                  return br.width * br.height - ar.width * ar.height;
                })[0] || null;
            };

            const restoreRoot = () => {
              if (!appliedRoot) return;
              appliedRoot.style.removeProperty("transform");
              appliedRoot.style.removeProperty("height");
              appliedRoot.style.removeProperty("min-height");
              appliedRoot.removeAttribute(MARKER);
              appliedRoot = null;
            };

            const apply = () => {
              scheduled = false;
              if (!document.body) return;

              const root = findRoot();
              if (!root) return;
              if (appliedRoot && appliedRoot !== root) restoreRoot();
              if (root.getAttribute(MARKER) === "true") return;

              const transform = getComputedStyle(root).transform;
              const existing = transform === "none" ? "" : transform;
              root.style.setProperty(
                "transform",
                `${existing} translateY(${SAFE_TOP}px)`.trim(),
                "important",
              );
              root.style.setProperty(
                "height",
                `calc(100vh - ${SAFE_TOP}px)`,
                "important",
              );
              root.style.setProperty(
                "min-height",
                `calc(100vh - ${SAFE_TOP}px)`,
                "important",
              );
              root.setAttribute(MARKER, "true");
              appliedRoot = root;
            };

            const schedule = () => {
              if (scheduled) return;
              scheduled = true;
              requestAnimationFrame(apply);
            };

            const start = () => {
              schedule();
              new MutationObserver(schedule).observe(document.documentElement, {
                childList: true,
                subtree: true,
              });
              window.addEventListener("resize", schedule, { passive: true });
              window.addEventListener("orientationchange", schedule, { passive: true });
            };

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", start, { once: true });
            } else {
              start();
            }
          })();
          EOF

      - name: Build macOS application
        shell: bash
        env:
          PAKE_URL: ${{ inputs.url }}
          PAKE_NAME: ${{ inputs.name }}
          PAKE_ICON: ${{ inputs.icon }}
          PAKE_WIDTH: ${{ inputs.width }}
          PAKE_HEIGHT: ${{ inputs.height }}
          PAKE_VERSION: ${{ inputs.app_version }}
          PAKE_MULTI_ARCH: ${{ inputs.multi_arch }}
        run: |
          set -euo pipefail

          ARGS=(
            "$PAKE_URL"
            "--name" "$PAKE_NAME"
            "--width" "$PAKE_WIDTH"
            "--height" "$PAKE_HEIGHT"
            "--app-version" "$PAKE_VERSION"

            # Must stay hidden
            "--hide-title-bar"

            # Align with main.yml: do not blindly rewrite all link clicks.
            # This keeps Telegram chat/group entry clicks in-app instead of opening new windows.
            "--force-internal-navigation"

            "--inject"
            "$RUNNER_TEMP/pake-macos-safe-area.css,$RUNNER_TEMP/pake-douyin-safe-area.js"
          )

          if [ -n "$PAKE_ICON" ]; then
            ARGS+=("--icon" "$PAKE_ICON")
          fi

          if [ "$PAKE_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          echo "Running Pake build..."
          node dist/cli.js "${ARGS[@]}"

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: "*.dmg"
          retention-days: 7
          if-no-files-found: error

      - name: Upload macOS application bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS-App
          path: "*.app"
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Rust cache
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
