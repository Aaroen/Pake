name: Build macOS App With Pake

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL"
        required: true
        type: string
        default: "https://www.douyin.com"

      name:
        description: "Application name"
        required: true
        type: string
        default: "Douyin"

      icon:
        description: "Icon URL or local path; leave empty to auto-fetch"
        required: false
        type: string
        default: ""

      width:
        description: "Window width in pixels"
        required: false
        type: string
        default: "1200"

      height:
        description: "Window height in pixels"
        required: false
        type: string
        default: "780"

      app_version:
        description: "Application version"
        required: false
        type: string
        default: "1.0.0"

      multi_arch:
        description: "Build universal Intel + Apple Silicon binary"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Restore Rust cache
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Build macOS application
        shell: bash
        env:
          PAKE_URL: ${{ inputs.url }}
          PAKE_NAME: ${{ inputs.name }}
          PAKE_ICON: ${{ inputs.icon }}
          PAKE_WIDTH: ${{ inputs.width }}
          PAKE_HEIGHT: ${{ inputs.height }}
          PAKE_VERSION: ${{ inputs.app_version }}
          PAKE_MULTI_ARCH: ${{ inputs.multi_arch }}
        run: |
          set -euo pipefail

          ARGS=(
            "$PAKE_URL"
            "--name" "$PAKE_NAME"
            "--width" "$PAKE_WIDTH"
            "--height" "$PAKE_HEIGHT"
            "--app-version" "$PAKE_VERSION"

            "--hide-title-bar"

            "--force-internal-navigation"
          )

          if [ -n "$PAKE_ICON" ]; then
            ARGS+=("--icon" "$PAKE_ICON")
          fi

          if [ "$PAKE_MULTI_ARCH" == "true" ]; then
            ARGS+=("--multi-arch")
          fi

          echo "Running Pake build..."
          node dist/cli.js "${ARGS[@]}"

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: "*.dmg"
          retention-days: 7
          if-no-files-found: error

      - name: Upload macOS application bundle
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS-App
          path: "*.app"
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Rust cache
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
